name: TrendBot — Execução diária

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  qualidade:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes
        run: pytest tests/ -v

      - name: Rodar testes com outra semente de hash
        # hash() de string em Python varia por processo (PYTHONHASHSEED). Já
        # tivemos um bug em que a "simulação determinística" dependia disso: a
        # suíte passava no PR e quebrava em main, dependendo da sorte. Rodar
        # uma segunda vez com outra semente fixa pega essa classe inteira de
        # bugs (ordem de hash) sem tornar o CI aleatório.
        env:
          PYTHONHASHSEED: 1
        run: pytest tests/ -q

  relatorio:
    name: Gerar e publicar relatório
    needs: qualidade
    # Em pull_request o checkout sai em HEAD desanexado e GITHUB_REF_NAME vem
    # como "<n>/merge": o push dos dados gerados tentaria um ref inválido.
    # Testes rodam em todo PR; publicar, só em main/schedule/dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar motor do TrendBot
        env:
          MOEDAS_ALVO: ${{ vars.MOEDAS_ALVO || 'bitcoin,ethereum,solana,cardano' }}
          DIAS_HISTORICO: ${{ vars.DIAS_HISTORICO || '1095' }}
          PERFIL_RISCO: ${{ vars.PERFIL_RISCO || 'moderado' }}
          CAPITAL_INICIAL: ${{ vars.CAPITAL_INICIAL || '10000' }}
          # Sem CARTEIRA_ATUAL a recomendacao pressupoe 100% caixa. Defina em
          # Settings > Secrets and variables > Actions > Variables para que o
          # relatorio rebalanceie as posicoes que voce realmente tem.
          CARTEIRA_ATUAL: ${{ vars.CARTEIRA_ATUAL }}
          APORTE_MENSAL: ${{ vars.APORTE_MENSAL }}
          FONTE_DADOS: 'auto'
        run: python trendbot_engine.py

      - name: Commit e push dos dados gerados
        run: |
          git config --global user.name "TrendBot Action"
          git config --global user.email "trendbot@actions.github.com"

          git add docs/data.json
          git add docs/historico.json
          # alocacao.png e relatorio_completo.json são artefatos do motor 2.x
          # listados no .gitignore (regenerados todo dia), então NÃO entram
          # aqui: tentar adicioná-los fazia o git add falhar com "path is
          # ignored" e derrubava o job. O relatorio_completo.json pesa ~94 KB
          # por causa das grades de quantis; quem vai para o painel é o
          # recomendacao.json, bem menor.
          #
          # Os laços evitam quebrar o job quando o arquivo não existe (um `git
          # add` sem correspondência é erro): o motor só gera os alertas e a
          # recomendação quando consegue montar a carteira.
          for f in docs/alerta_*.png docs/recomendacao.json; do
            [ -e "$f" ] && git add "$f"
          done
          # Se o ciclo não gerou recomendação, o arquivo antigo tem de sair:
          # o painel não pode servir a recomendação de ontem como se fosse de
          # hoje. O motor já o apaga, mas o git precisa registrar a remoção.
          [ -e docs/recomendacao.json ] || git rm --ignore-unmatch --cached docs/recomendacao.json

          if ! git diff --cached --quiet; then
            git commit -m "update: relatório diário [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "Sem mudanças nos dados. Nada a subir."
          fi
